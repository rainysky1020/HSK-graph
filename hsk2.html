<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK 2급 어휘 그래프</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Gowun+Batang:wght@700&family=Noto+Serif+SC:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#f2f4fa; --panel:rgba(255,255,255,.93); --line:#d6dcec;
    --ink:#1d2437; --muted:#5c6680; --dim:#8b94ad; --accent:#3b6fe0;
    --hover:#e4e9f6; --field:#ffffff;
    --e3:#4664b9; --e2:#129173; --e1:#806ac0; --e0:#788296;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0e1220; --panel:rgba(21,26,42,.94); --line:#28304d;
      --ink:#e8ebf5; --muted:#8e97b2; --dim:#5d668a; --accent:#8ab4ff;
      --hover:#232c4a; --field:#0c1020; --e3:#7f9fe8; --e2:#63cfa6; --e1:#a795ea; --e0:#8a94b3;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0e1220; --panel:rgba(21,26,42,.94); --line:#28304d;
    --ink:#e8ebf5; --muted:#8e97b2; --dim:#5d668a; --accent:#8ab4ff;
    --hover:#232c4a; --field:#0c1020; --e3:#7f9fe8; --e2:#63cfa6; --e1:#a795ea; --e0:#8a94b3;
  }
  html,body{height:100%;}
  body{margin:0; background:var(--ground); color:var(--ink);
    font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; overflow:hidden;}
  #cv{position:fixed; inset:0; cursor:grab; touch-action:none;}
  #cv.drag{cursor:grabbing;}
  .hud{position:fixed; z-index:5;}
  #brand{top:18px; left:20px; pointer-events:none;}
  #brand h1{font-family:'Gowun Batang','IBM Plex Sans KR',serif; font-weight:700; font-size:21px; margin:0 0 4px; letter-spacing:.5px;}
  #brand p{margin:0; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;}
  #controls{top:76px; left:20px; width:226px; display:flex; flex-direction:column; gap:10px; max-height:calc(100% - 100px);}
  .box{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px;}
  #search{width:100%; box-sizing:border-box; background:var(--field); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:8px 10px; font:inherit; font-size:13px;}
  #search::placeholder{color:var(--dim);}
  #search:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent;}
  #hits{margin-top:6px; font-size:12.5px; max-height:150px; overflow-y:auto;}
  #hits button{display:block; width:100%; text-align:left; background:none; border:0; color:var(--ink); padding:4px 6px; border-radius:6px; cursor:pointer; font:inherit; font-size:12.5px;}
  #hits button:hover,#hits button:focus-visible{background:var(--hover); outline:none;}
  #hits .py{color:var(--muted);}
  .boxlabel{font-size:10.5px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; margin:0 0 8px;}
  .foldHead{cursor:pointer; user-select:none; -webkit-user-select:none; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .foldHead .chev{font-size:9px; color:var(--dim); transition:transform .15s; flex:none;}
  .fold.closed .foldBody{display:none !important;}
  .fold.closed .foldHead{margin:0;}
  .fold.closed .chev{transform:rotate(-90deg);}
  #legend{overflow-y:auto; flex:1; min-height:0;}
  .chip{display:flex; align-items:center; gap:7px; width:100%; background:none; border:0; color:var(--ink); font:inherit; font-size:12.5px; padding:3px 6px; border-radius:6px; cursor:pointer; text-align:left;}
  .chip:hover,.chip:focus-visible{background:var(--hover); outline:none;}
  .chip .dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .chip .n{margin-left:auto; color:var(--dim); font-size:11px; font-variant-numeric:tabular-nums;}
  .chip.off{opacity:.32;}
  #resetC,#offC{margin-top:6px; font-size:11.5px; color:var(--accent); background:none; border:0; cursor:pointer; padding:2px 6px; font-family:inherit;}
  .tgl{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:3px 0; cursor:pointer;}
  .tgl input{accent-color:var(--accent);}
  .tgl .sw{width:22px; height:0; border-top:2px solid var(--e3); flex:none;}
  .tgl .sw.k3{border-top-width:3px;}
  .tgl .sw.k2{border-top-color:var(--e2);}
  .tgl .sw.k1{border-top-style:dashed; border-top-color:var(--e1);}
  .tgl .sw.k0{border-top-style:dotted; border-top-color:var(--e0);}
  #dimSel{display:flex; gap:4px; margin:0 0 8px; flex:none;}
  #dimSel button{flex:1; font-size:11.5px; padding:4px 0; background:none; border:1px solid var(--line); border-radius:7px; color:var(--muted); cursor:pointer; font-family:inherit;}
  #dimSel button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  #hint{position:fixed; left:20px; bottom:14px; font-size:11.5px; color:var(--dim); z-index:5; pointer-events:none;}
  #panel{position:fixed; top:18px; right:18px; width:272px; max-height:calc(100% - 36px); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; z-index:6; display:none; overflow-y:auto; box-sizing:border-box;}
  #panel.on{display:block;}
  #panel .zi{font-size:38px; line-height:1.1; font-weight:600; font-family:SimSun,'宋体','Songti SC','Noto Serif SC',serif;}
  #panel .py{color:var(--accent); font-size:15px; margin-top:2px;}
  #panel .mean{font-size:14px; margin-top:6px;}
  #panel .cl{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); margin-top:10px;}
  #panel .cl .dot{width:8px; height:8px; border-radius:50%;}
  #panel h3{font-size:10.5px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; margin:16px 0 6px;}
  #panel .lk{display:flex; gap:8px; align-items:baseline; width:100%; background:none; border:0; color:var(--ink); font:inherit; font-size:13px; padding:3px 4px; border-radius:6px; cursor:pointer; text-align:left;}
  #panel .lk:hover,#panel .lk:focus-visible{background:var(--hover); outline:none;}
  #panel .lk span:first-child{font-family:SimSun,'宋体','Songti SC','Noto Serif SC',serif;}
  #panel .lk .m{color:var(--muted); font-size:11.5px;}
  #panel .lk .via{margin-left:auto; color:var(--dim); font-size:11px;}
  #close{position:absolute; top:10px; right:10px; background:none; border:0; color:var(--dim); font-size:16px; cursor:pointer; padding:4px; font-family:inherit;}
  #close:hover{color:var(--ink);}
  @media (max-width:760px){ #controls{width:190px;} #panel{width:230px;} }
</style>

</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="brand">
  <h1>2급 어휘 그래프</h1>
  <p>단어 200 · 연결 190 — L1~L4 분류체계의 그물</p>
</div>

<div class="hud" id="controls">
  <div class="box">
    <input id="search" type="search" placeholder="단어·병음·뜻 검색" aria-label="단어 검색">
    <div id="hits"></div>
  </div>
  <div class="box fold">
    <p class="boxlabel foldHead">연결 종류<span class="chev">▼</span></p>
    <div class="foldBody">
    <label class="tgl"><input type="checkbox" id="t3" checked><span class="sw k3"></span>L4 같은 세분류 — 가장 강함</label>
    <label class="tgl"><input type="checkbox" id="t2" checked><span class="sw k2"></span>L3 같은 소분류</label>
    <label class="tgl"><input type="checkbox" id="t1" checked><span class="sw k1"></span>L2 같은 중분류</label>
    <label class="tgl"><input type="checkbox" id="t0" checked><span class="sw k0"></span>L1 같은 대분류 — 느슨함</label>
    </div>
  </div>
  <div class="box fold" id="legendBox" style="display:flex;flex-direction:column;min-height:0;">
    <p class="boxlabel foldHead">클러스터 — 눌러서 켜고 끄기<span class="chev">▼</span></p>
    <div class="foldBody" style="display:flex;flex-direction:column;min-height:0;flex:1;">
    <div id="dimSel">
      <button data-d="0" class="on">대분류</button>
      <button data-d="1">중분류</button>
      <button data-d="2">소분류</button>
    </div>
    <div id="legend"></div>
    <div style="display:flex;gap:2px;"><button id="resetC">모두 켜기</button><button id="offC">모두 끄기</button></div>
    </div>
  </div>
</div>

<p id="hint">드래그: 이동 · 휠/핀치: 확대 · 노드 클릭: 상세 · 확대할수록 라벨이 나타납니다</p>

<aside id="panel" aria-live="polite">
  <button id="close" aria-label="닫기">✕</button>
  <div class="zi" id="pZi"></div>
  <div class="py" id="pPy"></div>
  <div class="mean" id="pMean"></div>
  <div class="cl"><span class="dot" id="pDot"></span><span id="pCl"></span></div>
  <div id="pLinks"></div>
</aside>

function shade(hex,f){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const t=f>0?255:0, a=Math.abs(f), m=v=>Math.round(v+(t-v)*a);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
let HI=null, SH=null;
function buildSprites(){
  SPR = T.pal.map(col=>{
    const S=192, c=document.createElement('canvas'); c.width=c.height=S;
    const g=c.getContext('2d'), R=S/2;
    /* 확산광 — 좌상단 광원, 비선형 감쇠 (스펙큘러는 draw에서 동적으로) */
    const grad=g.createRadialGradient(R*0.58,R*0.50,R*0.05,R*0.86,R*0.82,R*1.25);
    grad.addColorStop(0,    shade(col,0.50));
    grad.addColorStop(0.18, shade(col,0.28));
    grad.addColorStop(0.45, shade(col,0.06));
    grad.addColorStop(0.70, shade(col,-0.16));
    grad.addColorStop(0.88, shade(col,-0.38));
    grad.addColorStop(1,    shade(col,-0.55));
    g.fillStyle=grad;
    g.beginPath(); g.arc(R,R,R-1,0,6.2832); g.fill();
    /* 하단 반사광(바운스 라이트) */
    const bounce=g.createRadialGradient(R*1.02,R*1.62,R*0.1,R*1.02,R*1.18,R*0.9);
    bounce.addColorStop(0,'rgba(255,255,255,0.12)');
    bounce.addColorStop(0.55,'rgba(255,255,255,0.04)');
    bounce.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=bounce;
    g.beginPath(); g.arc(R,R,R-1,0,6.2832); g.fill();
    return c;
  });
  /* 스펙큘러 글린트(공용) — 부유 시 광원 반대 방향으로 미끄러짐 */
  HI=document.createElement('canvas'); HI.width=HI.height=96;
  const h=HI.getContext('2d');
  const hg=h.createRadialGradient(48,48,2,48,48,46);
  hg.addColorStop(0,'rgba(255,255,255,0.80)');
  hg.addColorStop(0.28,'rgba(255,255,255,0.24)');
  hg.addColorStop(1,'rgba(255,255,255,0)');
  h.fillStyle=hg; h.fillRect(0,0,96,96);
  /* 바닥 그림자(공용) — 공은 뜨고 그림자는 제자리 → 부유감 */
  SH=document.createElement('canvas'); SH.width=SH.height=96;
  const s=SH.getContext('2d');
  const sc=(themeName()==='dark')?'0,0,0':'29,36,55';
  const sa=(themeName()==='dark')?0.50:0.22;
  const sg=s.createRadialGradient(48,48,4,48,48,46);
  sg.addColorStop(0,`rgba(${sc},${sa})`);
  sg.addColorStop(0.6,`rgba(${sc},${sa*0.4})`);
  sg.addColorStop(1,`rgba(${sc},0)`);
  s.fillStyle=sg; s.fillRect(0,0,96,96);
}
buildSprites();   /* 초기 draw 이전에 준비 */

const N = G.nodes, L = G.links;
let dim = 0;                       /* 클러스터 차원: 0=대분류 1=중분류 2=소분류 */
let CL = G.dims[dim];
N.forEach(n=>{ n.c = n.cs[dim]; });
const adj = N.map(()=>[]);
L.forEach(([a,b,k,ch])=>{adj[a].push({o:b,k,ch}); adj[b].push({o:a,k,ch});});

/* 부유 애니메이션 파라미터 */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
N.forEach((n,i)=>{ n.ph = (i*2654435761 % 6283)/1000; n.ph2 = (i*40503 % 6283)/1000;
                   n.amp = 1.2 + (n.r/12)*1.6; n.w = 0.00042 + ((i*97)%40)/100000; });
let animOn = !reduceMotion;
let tNow = 0;
const fx = n => n.x + (n.ox||0) + (animOn ? Math.sin(tNow*n.w + n.ph)*n.amp : 0);
const fy = n => n.y + (n.oy||0) + (animOn ? Math.cos(tNow*n.w*0.9 + n.ph2)*n.amp : 0);

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let DPR = Math.min(2, devicePixelRatio||1), Wd=0, Ht=0;
function resize(){ Wd=innerWidth; Ht=innerHeight; cv.width=Wd*DPR; cv.height=Ht*DPR; cv.style.width=Wd+'px'; cv.style.height=Ht+'px'; draw(); }
addEventListener('resize', resize);

let k=0.8, tx=0, ty=0;
function fitAll(){
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  N.forEach(n=>{minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x);minY=Math.min(minY,n.y);maxY=Math.max(maxY,n.y);});
  const pad=70, w=maxX-minX+2*pad, h=maxY-minY+2*pad;
  k=Math.min(Wd/w, Ht/h);
  tx=Wd/2-(minX+maxX)/2*k+110*Math.min(1,k); ty=Ht/2-(minY+maxY)/2*k;
}

const CELL=80, grid=new Map();
N.forEach((n,i)=>{const key=(n.x/CELL|0)+','+(n.y/CELL|0); (grid.get(key)||grid.set(key,[]).get(key)).push(i);});
function pick(px,py){
  const gx=(px-tx)/k, gy=(py-ty)/k;
  const cx=gx/CELL|0, cy=gy/CELL|0;
  let best=-1, bd=1e9;
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
    const cell=grid.get((cx+dx)+','+(cy+dy)); if(!cell) continue;
    for(const i of cell){
      const n=N[i], d=(n.x-gx)**2+(n.y-gy)**2, r=Math.max(n.r+5, 9/k);
      if(d<r*r && d<bd){bd=d; best=i;}
    }
  }
  return best;
}

let clOn = CL.map(()=>true);
const show = [true,true,true,true];
let selected=-1, hovered=-1;
function neighborSet(i){ const s=new Set([i]); adj[i].forEach(a=>s.add(a.o)); return s; }

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=T.ground; ctx.fillRect(0,0,Wd,Ht);
  ctx.translate(tx, ty); ctx.scale(k,k);
  const focus = selected>=0?selected:((hovered>=0 && dragN<0 && !springSet.size)?hovered:-1);
  const nb = focus>=0?neighborSet(focus):null;
  const vx0=(-tx)/k-60, vy0=(-ty)/k-60, vx1=(Wd-tx)/k+60, vy1=(Ht-ty)/k+60;

  /* L1~L4 연결: L4=실선 굵게, L3=실선, L2=파선, L1=점선 */
  const dashOn = k>=0.5 || L.length<=2500;   /* 초대형 그래프 축소 시에만 실선(성능) */
  const ECD = dashOn ? {3:[], 2:[], 1:[6/k,4.5/k], 0:[1.5/k,4/k]} : {3:[], 2:[], 1:[], 0:[]};
  const EBASE={3:0.60, 2:0.45, 1:0.36, 0:0.26};
  const EW={3:1.5, 2:1, 1:1, 0:1};
  for(const pass of [0,1,2,3]){
    if(!show[pass]) continue;
    ctx.setLineDash(ECD[pass]);
    ctx.lineCap = pass===0?'round':'butt';
    ctx.lineWidth = EW[pass]/k;
    for(const grp of (nb?[0,1]:[0])){   /* 같은 색·투명도는 한 패스로 배치 스트로크 */
      ctx.beginPath();
      let any=false;
      for(const [a,b,kind] of L){
        if(kind!==pass) continue;
        if(nb && ((a===focus||b===focus)?1:0)!==grp) continue;
        const na=N[a], nbn=N[b];
        if(!clOn[na.c]||!clOn[nbn.c]) continue;
        if((na.x<vx0&&nbn.x<vx0)||(na.x>vx1&&nbn.x>vx1)||(na.y<vy0&&nbn.y<vy0)||(na.y>vy1&&nbn.y>vy1)) continue;
        ctx.moveTo(fx(na),fy(na)); ctx.lineTo(fx(nbn),fy(nbn)); any=true;
      }
      if(any){
        ctx.strokeStyle=`rgba(${T.e[pass]},${nb?(grp?0.95:0.03):EBASE[pass]})`;
        ctx.stroke();
      }
    }
  }
  ctx.setLineDash([]); ctx.lineCap='butt';
  for(const n of N){
    if(n.x<vx0||n.x>vx1||n.y<vy0||n.y>vy1) continue;
    ctx.globalAlpha = clOn[n.c]?1:0.05;
    const X=fx(n), Y=fy(n), r=n.r, vis=clOn[n.c] && r*k>4;
    if(vis) ctx.drawImage(SH, n.x-r*0.8, n.y+r*0.95, r*1.6, r*0.55);
    ctx.drawImage(SPR[n.c % SPR.length], X-r, Y-r, r*2, r*2);
    if(vis){
      const dxc=Math.max(-r*0.18,Math.min(r*0.18,(X-n.x)*0.6));
      const dyc=Math.max(-r*0.18,Math.min(r*0.18,(Y-n.y)*0.6));
      const hr=r*1.05;
      ctx.drawImage(HI, X-r*0.34-dxc-hr/2, Y-r*0.40-dyc-hr/2, hr, hr);
    }
  }
  ctx.globalAlpha=1;
  if(nb){
    for(let i=0;i<N.length;i++){
      const n=N[i];
      if(n.x<vx0||n.x>vx1||n.y<vy0||n.y>vy1) continue;
      if(nb.has(i)||!clOn[n.c]) continue;
      ctx.fillStyle=T.dimFill;
      ctx.beginPath(); ctx.arc(fx(n),fy(n),n.r+0.6,0,6.2832); ctx.fill();
    }
    for(const i of nb){
      const n=N[i]; if(!clOn[n.c]) continue;
      const X=fx(n), Y=fy(n), r=n.r;
      ctx.drawImage(SPR[n.c % SPR.length], X-r, Y-r, r*2, r*2);
      if(r*k>4){
        const dxc=Math.max(-r*0.18,Math.min(r*0.18,(X-n.x)*0.6));
        const dyc=Math.max(-r*0.18,Math.min(r*0.18,(Y-n.y)*0.6));
        const hr=r*1.05;
        ctx.drawImage(HI, X-r*0.34-dxc-hr/2, Y-r*0.40-dyc-hr/2, hr, hr);
      }
    }
  }
  const showAll = k>=0.6;
  const degMin = showAll?0:3;
  ctx.textAlign='center'; ctx.textBaseline='top';
  const lk=Math.min(k,1);
  ctx.lineWidth=3/lk; ctx.strokeStyle=T.ground;
  for(let i=0;i<N.length;i++){
    const n=N[i];
    if(n.x<vx0||n.x>vx1||n.y<vy0||n.y>vy1) continue;
    if(!clOn[n.c]) continue;
    const isNb = nb?nb.has(i):false;
    if(nb && !isNb) continue;
    if(!nb && n.deg<degMin && !showAll) continue;
    const fs=(n.deg>=8?13:11)/lk;
    if(fs*k<7) continue;
    ctx.font=`500 ${fs}px SimSun,'宋体','Songti SC','Noto Serif SC',serif`;
    ctx.fillStyle=T.label;
    ctx.strokeText(n.id, fx(n), fy(n)+n.r+3/lk);
    ctx.fillText(n.id, fx(n), fy(n)+n.r+3/lk);
  }
  ctx.setTransform(1,0,0,1,0,0);
}

/* 부유 애니메이션 루프 (30fps, 저사양 자동 강등, 탭 숨김 시 정지) */
let lastFrame=0, slowCount=0;
function loop(ts){
  if(!animOn) return;
  requestAnimationFrame(loop);
  if(ts-lastFrame < 33) return;
  lastFrame = ts; tNow = ts;
  const t0 = performance.now();
  draw();
  const dt = performance.now()-t0;
  if(dt>34){ if(++slowCount>45){ animOn=false; draw(); } } else if(slowCount>0) slowCount--;
}
if(animOn) requestAnimationFrame(loop);
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  if(animOn){ lastFrame=0; requestAnimationFrame(loop); }
});

let dragging=false, lx=0, ly=0, moved=0;
let dragN=-1, springOn=false;
const springSet=new Set();
const pts=new Map();               /* 활성 포인터(멀티터치) */
let pinchD=0, pinchCX=0, pinchCY=0;
cv.addEventListener('pointerdown', e=>{
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  cv.setPointerCapture(e.pointerId);
  if(pts.size===2){                /* 핀치 시작 */
    if(dragN>=0) releaseNode();
    dragging=false; moved=99;
    const [a,b]=[...pts.values()];
    pinchD=Math.hypot(a.x-b.x,a.y-b.y);
    pinchCX=(a.x+b.x)/2; pinchCY=(a.y+b.y)/2;
  } else if(pts.size===1){
    moved=0; lx=e.clientX; ly=e.clientY;
    const h=pick(e.clientX,e.clientY);
    if(h>=0){ dragN=h; const n=N[h]; n.vx=n.vy=0; springSet.delete(h); }
    else { dragging=true; cv.classList.add('drag'); }
  }
});
cv.addEventListener('pointermove', e=>{
  if(pts.has(e.pointerId)) pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){                /* 핀치 확대/축소 + 두 손가락 이동 */
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    if(pinchD>0 && d>0){
      const nk=Math.min(6, Math.max(0.15, k*(d/pinchD)));
      tx = cx-(pinchCX-tx)*(nk/k); ty = cy-(pinchCY-ty)*(nk/k);
      k=nk;
    }
    pinchD=d; pinchCX=cx; pinchCY=cy;
    if(!animOn) draw();
    return;
  }
  if(dragN>=0){
    const n=N[dragN];
    n.ox=(n.ox||0)+(e.clientX-lx)/k; n.oy=(n.oy||0)+(e.clientY-ly)/k;
    moved+=Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly);
    lx=e.clientX; ly=e.clientY;
    if(!animOn) draw();
  }
  else if(dragging){ tx+=e.clientX-lx; ty+=e.clientY-ly; moved+=Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly); lx=e.clientX; ly=e.clientY; if(!animOn) draw(); }
  else { const h=pick(e.clientX,e.clientY); if(h!==hovered){hovered=h; if(!animOn) draw();} }
});
const endPointer = e=>{
  pts.delete(e.pointerId);
  if(pts.size===1){                /* 손가락 하나 남으면 팬으로 전환 */
    const [a]=[...pts.values()];
    dragging=true; lx=a.x; ly=a.y; pinchD=0;
  } else if(pts.size===0){
    if(dragN>=0){
      const tap = moved<6, i=dragN;
      releaseNode();
      if(tap){ const n=N[i]; n.ox=n.oy=n.vx=n.vy=0; springSet.delete(i); select(i); }
    } else if(dragging && moved<6){
      const h=pick(e.clientX,e.clientY); select(h);
    }
    dragging=false; pinchD=0; cv.classList.remove('drag');
  }
};
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

/* 노드 당김 스프링 — 놓으면 통통 튀며 제자리로 */
function releaseNode(){
  if(dragN<0) return;
  const n=N[dragN];
  if((n.ox||0)||(n.oy||0)){
    springSet.add(dragN);
    if(!springOn){ springOn=true; requestAnimationFrame(springStep); }
  }
  dragN=-1;
}
function springStep(){
  if(!springSet.size){ springOn=false; if(!animOn) draw(); return; }
  const dt=1/60;
  for(const i of [...springSet]){
    const n=N[i];
    n.vx=(n.vx||0)+(-160*(n.ox||0)-7*(n.vx||0))*dt;
    n.vy=(n.vy||0)+(-160*(n.oy||0)-7*(n.vy||0))*dt;
    n.ox=(n.ox||0)+n.vx*dt; n.oy=(n.oy||0)+n.vy*dt;
    if(Math.abs(n.ox)<0.15&&Math.abs(n.oy)<0.15&&Math.abs(n.vx)<2&&Math.abs(n.vy)<2){
      n.ox=n.oy=n.vx=n.vy=0; springSet.delete(i);
    }
  }
  if(!animOn) draw();
  requestAnimationFrame(springStep);
}
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const f = Math.exp(-e.deltaY*0.0015);
  const nk = Math.min(6, Math.max(0.15, k*f));
  tx = e.clientX-(e.clientX-tx)*(nk/k); ty = e.clientY-(e.clientY-ty)*(nk/k);
  k=nk; if(!animOn) draw();
},{passive:false});

/* 패널 접기/펴기 (모바일 공간 확보) */
document.querySelectorAll('.foldHead').forEach(h=>{
  h.addEventListener('click', ()=>h.closest('.fold').classList.toggle('closed'));
});

function paintPanelDot(){ if(selected>=0) document.getElementById('pDot').style.background=PAL(N[selected].c); }
function select(i){
  selected=i; if(!animOn) draw();
  const panel=document.getElementById('panel');
  if(i<0){panel.classList.remove('on'); return;}
  const n=N[i];
  document.getElementById('pZi').textContent=n.id;
  document.getElementById('pPy').textContent=n.py;
  document.getElementById('pMean').textContent=n.m;
  document.getElementById('pCl').textContent=`${G.dims[0][n.cs[0]]} › ${G.dims[1][n.cs[1]]} › ${G.dims[2][n.cs[2]]} › ${G.dims[3][n.p4]}` + ' · 연결 '+n.deg+'개';
  paintPanelDot();
  const box=document.getElementById('pLinks'); box.innerHTML='';
  const groups={3:[],2:[],1:[],0:[]};
  adj[i].forEach(a=>groups[a.k].push(a));
  const mk=(title,arr,showVia)=>{
    if(!arr.length) return;
    const h=document.createElement('h3'); h.textContent=title; box.appendChild(h);
    arr.slice(0,40).forEach(a=>{
      const n2=N[a.o];
      const b=document.createElement('button'); b.className='lk';
      b.innerHTML=`<span>${n2.id}</span><span class="m">${n2.py} · ${n2.m}</span>`+(showVia&&a.ch?`<span class="via">${a.ch} 공유</span>`:'');
      b.onclick=()=>focusNode(a.o);
      box.appendChild(b);
    });
    if(arr.length>40){const p=document.createElement('p'); p.style.cssText='color:var(--dim);font-size:11px;margin:4px'; p.textContent='… 외 '+(arr.length-40)+'개'; box.appendChild(p);}
  };
  mk('같은 세분류 · '+G.dims[3][n.p4], groups[3], false);
  mk('같은 소분류 · '+G.dims[2][n.cs[2]], groups[2], false);
  mk('같은 중분류 · '+G.dims[1][n.cs[1]], groups[1], false);
  mk('같은 대분류 · '+G.dims[0][n.cs[0]], groups[0], false);
  panel.classList.add('on');
}
function focusNode(i){
  const n=N[i]; selected=i;
  const nk=Math.max(k,1.6);
  tx=Wd/2-n.x*nk; ty=Ht/2-n.y*nk; k=nk;
  select(i); if(!animOn) draw();
}
document.getElementById('close').onclick=()=>select(-1);

const legend=document.getElementById('legend');
function buildLegend(){
  legend.innerHTML='';
  const counts=CL.map(()=>0); N.forEach(n=>counts[n.c]++);
  CL.forEach((c,i)=>{
    const b=document.createElement('button'); b.className='chip';
    b.innerHTML=`<span class="dot" data-ci="${i}"></span>${c}<span class="n">${counts[i]}</span>`;
    b.onclick=()=>{clOn[i]=!clOn[i]; b.classList.toggle('off',!clOn[i]); if(!animOn) draw();};
    legend.appendChild(b);
  });
  refreshLegendColors();
}
function setDim(d){
  dim=d; CL=G.dims[d];
  N.forEach(n=>{ n.c=n.cs[d]; });
  clOn=CL.map(()=>true);
  document.querySelectorAll('#dimSel button').forEach(b=>b.classList.toggle('on',+b.dataset.d===d));
  buildLegend(); if(selected>=0){ paintPanelDot(); }
  draw();
}
document.querySelectorAll('#dimSel button').forEach(b=>b.onclick=()=>setDim(+b.dataset.d));
buildLegend();
function refreshLegendColors(){
  legend.querySelectorAll('.dot[data-ci]').forEach(d=>{ d.style.background = PAL(+d.dataset.ci); });
}
document.getElementById('resetC').onclick=()=>{
  CL.forEach((c,i)=>clOn[i]=true);
  legend.querySelectorAll('.chip').forEach(x=>x.classList.remove('off'));
  if(!animOn) draw();
};
document.getElementById('offC').onclick=()=>{
  CL.forEach((c,i)=>clOn[i]=false);
  legend.querySelectorAll('.chip').forEach(x=>x.classList.add('off'));
  if(!animOn) draw();
};
document.getElementById('t0').onchange=e=>{show[0]=e.target.checked; if(!animOn) draw();};
document.getElementById('t1').onchange=e=>{show[1]=e.target.checked; if(!animOn) draw();};
document.getElementById('t2').onchange=e=>{show[2]=e.target.checked; if(!animOn) draw();};
document.getElementById('t3').onchange=e=>{show[3]=e.target.checked; if(!animOn) draw();};

const searchEl=document.getElementById('search'), hits=document.getElementById('hits');
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
searchEl.addEventListener('input', ()=>{
  const q=searchEl.value.trim().toLowerCase(); hits.innerHTML='';
  if(!q) return;
  const res=[];
  for(let i=0;i<N.length&&res.length<8;i++){
    const n=N[i];
    if(n.id.includes(q)||strip(n.py).includes(q)||n.m.toLowerCase().includes(q)) res.push(i);
  }
  res.forEach(i=>{
    const n=N[i], b=document.createElement('button');
    b.innerHTML=`${n.id} <span class="py">${n.py} · ${n.m}</span>`;
    b.onclick=()=>focusNode(i);
    hits.appendChild(b);
  });
});
